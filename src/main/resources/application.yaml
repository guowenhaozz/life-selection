server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        concurrency: 2
        max-concurrency: 4
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2
          max-interval: 2s
  application:
    name: hmdp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: debug

hmdp:
  order-reliability:
    enabled: ${ORDER_RELIABILITY_ENABLED:true}
    admin-enabled: ${ORDER_RELIABILITY_ADMIN_ENABLED:false}
    admin-user-ids: ${ORDER_RELIABILITY_ADMIN_USER_IDS:0}
    reconcile-batch-size: ${ORDER_RELIABILITY_RECONCILE_BATCH_SIZE:100}
    reconcile-fixed-delay-ms: ${ORDER_RELIABILITY_RECONCILE_FIXED_DELAY_MS:30000}
    reconcile-timeout-seconds: ${ORDER_RELIABILITY_RECONCILE_TIMEOUT_SECONDS:60}
    dead-letter-batch-size: ${ORDER_RELIABILITY_DEAD_LETTER_BATCH_SIZE:100}
    dead-letter-fixed-delay-ms: ${ORDER_RELIABILITY_DEAD_LETTER_FIXED_DELAY_MS:5000}
